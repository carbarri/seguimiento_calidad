<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Visitas — Mecanismo de Calidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2a27;
    --ink-soft:#5c5a54;
    --paper:#ece9df;
    --paper-raised:#ffffff;
    --line:#d8d5c8;
    --gold:#eb5a34;
    --gold-soft:#fbe0d5;
    --teal:#0e9d63;
    --clay:#eb5a34;
    --clay-soft:#fbe0d5;
    --grey:#8a8a82;
    --grey-soft:#e7e5da;
    --shadow: 0 2px 10px rgba(43,42,39,0.08);
    --radius: 3px;
    font-family: 'Rubik', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); min-height:100vh; padding:26px;}
  .wrap{max-width:1320px; margin:0 auto;}

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px; padding-bottom:18px;
    border-bottom:2px solid var(--ink); margin-bottom:16px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .uah-avatar{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%; background:var(--ink); color:var(--paper-raised);
    font-family:'Rubik', sans-serif; font-weight:800; font-size:15px; letter-spacing:-0.02em; flex-shrink:0;
  }
  .brand-divider{width:1px; height:32px; background:var(--line);}
  .brand h1{font-family:'Rubik', sans-serif; font-weight:700; font-size:26px; line-height:1.05; margin:0; letter-spacing:-0.01em;}
  .brand p{margin:4px 0 0; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em;}

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin-bottom:14px;
  }
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .filters select, .filters input[type=text]{
    font-family:'Rubik', sans-serif; font-size:12.5px; padding:7px 10px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-raised); color:var(--ink);
  }
  .filters input[type=text]{min-width:200px;}

  .nav-window{display:flex; align-items:center; gap:6px;}
  .nav-btn{
    width:30px; height:30px; border:1px solid var(--ink); background:var(--paper-raised);
    color:var(--ink); border-radius:var(--radius); cursor:pointer; font-size:14px; line-height:1;
  }
  .nav-btn:hover{background:var(--gold-soft);}
  .range-label{
    font-family:'Rubik', sans-serif; font-weight:500; font-size:12px; color:var(--ink-soft);
    padding:0 6px; white-space:nowrap;
  }
  .btn-fit{
    font-size:12px; font-weight:600; padding:7px 12px; border:1px solid var(--ink);
    background:none; color:var(--ink); border-radius:var(--radius); cursor:pointer;
  }
  .btn-fit:hover{background:var(--grey-soft);}
  .btn-primary{
    font-family:'Rubik', sans-serif; font-weight:600; font-size:13px; padding:9px 16px;
    background:var(--ink); color:var(--paper-raised); border:1px solid var(--ink); border-radius:var(--radius);
    cursor:pointer; white-space:nowrap;
  }
  .btn-primary:hover{background:var(--gold); border-color:var(--gold);}

  .board{
    display:grid; grid-template-columns: 280px 1fr;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .side{border-right:1px solid var(--line); display:flex; flex-direction:column;}
  .side-head, .chart-head{
    height:48px; display:flex; align-items:center; padding:0 16px;
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft);
    border-bottom:1px solid var(--line); font-weight:600; background:var(--grey-soft);
  }
  .group-header{
    height:26px; display:flex; align-items:center; padding:0 16px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; font-weight:700;
    color:var(--paper-raised); background:var(--ink);
  }
  .group-header-spacer{height:26px; background:var(--ink); opacity:0.94;}

  .program-row{display:flex; align-items:center; gap:9px; padding:0 16px; height:56px; border-bottom:1px solid var(--line);}
  .program-row.pending-row{opacity:0.65;}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .program-name{font-size:13px; font-weight:600; line-height:1.2;}
  .program-tag{font-size:10.5px; color:var(--clay); font-weight:600; margin-top:2px;}

  .chart-scroll{overflow-x:auto;}
  .chart{min-width:760px; position:relative;}
  .chart-head{position:relative; padding:0;}
  .months{display:grid; width:100%; height:100%;}
  .month-cell{
    display:flex; align-items:center; justify-content:center;
    font-family:'Rubik', sans-serif; font-weight:500; font-size:11px; color:var(--ink-soft);
    border-right:1px solid var(--line);
  }
  .month-cell:last-child{border-right:none;}

  .track-row{position:relative; height:56px; border-bottom:1px solid var(--line);}
  .track-row.pending-row{background:transparent;}
  .grid-lines{position:absolute; inset:0; display:grid; pointer-events:none;}
  .grid-lines div{border-right:1px solid var(--line); opacity:0.6;}
  .grid-lines div:last-child{border-right:none;}

  .today-line{position:absolute; top:0; bottom:0; width:0; border-left:1.5px dashed var(--clay); z-index:5;}
  .today-tag{
    position:absolute; top:-1px; left:4px; font-family:'Rubik', sans-serif; font-weight:600; font-size:9px;
    color:var(--clay); background:var(--paper-raised); padding:0 4px; white-space:nowrap; z-index:6;
  }

  .bar{
    position:absolute; top:11px; height:34px; border-radius:4px; display:flex; align-items:center;
    padding:0 10px; font-size:11px; font-weight:600; color:var(--paper-raised); cursor:pointer;
    box-shadow:0 1px 3px rgba(28,43,58,0.18); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:filter .12s ease, transform .12s ease;
  }
  .bar:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .bar.programada{background:var(--clay);}
  .bar.confirmada{background:var(--teal);}
  .bar.realizada{background:var(--ink);}
  .bar.reprogramada{background:var(--grey);}


  .legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:16px; font-size:12px; color:var(--ink-soft);}
  .legend span{display:flex; align-items:center; gap:6px;}
  .legend i{width:11px; height:11px; border-radius:3px; display:inline-block;}

  .summary{display:flex; gap:22px; flex-wrap:wrap; margin-top:6px; font-size:12px; color:var(--ink-soft);}
  .summary b{color:var(--ink); font-family:'Rubik', sans-serif; font-weight:700;}

  .overlay{position:fixed; inset:0; background:rgba(28,43,58,0.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper-raised); border-radius:var(--radius); width:100%; max-width:440px; box-shadow:0 12px 40px rgba(28,43,58,0.3); border-top:4px solid var(--gold);}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:18px 22px 0;}
  .modal-head h2{font-family:'Rubik', sans-serif; font-size:19px; font-weight:700; margin:0;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .modal-body{padding:16px 22px 22px; display:flex; flex-direction:column; gap:13px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field select, .field input, .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:'Rubik', sans-serif; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:46px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-footer{display:flex; justify-content:space-between; gap:10px; padding-top:4px;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--clay); font-size:13px; font-weight:600; padding:9px 14px; border-radius:var(--radius); cursor:pointer;}
  .btn-ghost:hover{background:var(--clay-soft);}
  .btn-secondary{background:none; border:1px solid var(--ink); color:var(--ink); font-size:13px; font-weight:600; padding:9px 14px; border-radius:var(--radius); cursor:pointer;}
  .btn-secondary:hover{background:var(--grey-soft);}

  .side-head-row{display:flex; align-items:center; justify-content:space-between; width:100%;}
  .link-btn{background:none; border:none; color:var(--gold); font-weight:700; font-size:12px; cursor:pointer; padding:0;}
  .link-btn:hover{text-decoration:underline;}

  .foot-note{margin-top:12px; font-size:11px; color:var(--ink-soft); text-align:right;}
  @media (max-width:760px){
    .board{grid-template-columns:150px 1fr;}
    .brand h1{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="uah-avatar">uah</span>
      <span class="brand-divider"></span>
      <div>
        <h1>Calendario de Visitas</h1>
        <p>Mecanismo de Calidad — Programas de Magíster</p>
      </div>
    </div>
    <button class="btn-primary" id="openModalBtn">+ Nueva visita</button>
  </header>

  <div class="toolbar">
    <div class="filters">
      <select id="facultyFilter"></select>
      <input type="text" id="searchInput" placeholder="Buscar programa…">
    </div>
    <div class="nav-window">
      <button class="btn-fit" id="fitBtn">Ajustar a datos</button>
      <button class="nav-btn" id="prevBtn">&#8592;</button>
      <span class="range-label" id="rangeLabel"></span>
      <button class="nav-btn" id="nextBtn">&#8594;</button>
    </div>
  </div>

  <div class="board">
    <div class="side">
      <div class="side-head">
        <div class="side-head-row">
          <span>Programa</span>
          <button class="link-btn" id="addProgramBtn">+ Programa</button>
        </div>
      </div>
      <div id="sideList"></div>
    </div>
    <div class="chart-scroll">
      <div class="chart">
        <div class="chart-head"><div class="months" id="monthsHead"></div></div>
        <div id="chartBody"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><i style="background:var(--clay)"></i> Programada</span>
    <span><i style="background:var(--teal)"></i> Confirmada</span>
    <span><i style="background:var(--ink)"></i> Realizada</span>
    <span><i style="background:var(--grey)"></i> Reprogramada</span>
    <span><i style="background:var(--clay-soft); border:1px dashed var(--clay);"></i> Pendiente por definir</span>
  </div>
  <div class="summary" id="summaryLine"></div>
  <p class="foot-note" id="footNote">Cargando datos guardados…</p>
</div>

<!-- Modal: visita -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Nueva visita</h2>
      <button class="modal-close" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="visitId">
      <div class="field">
        <label>Programa de Magíster</label>
        <select id="fProgram"></select>
      </div>
      <div class="field">
        <label>Tipo de visita</label>
        <select id="fType">
          <option>Visita Mecanismo de Calidad</option>
          <option>Autoevaluación</option>
          <option>Visita de Verificación</option>
          <option>Visita de Pares Evaluadores</option>
          <option>Visita de Seguimiento</option>
          <option>Acreditación Final</option>
        </select>
      </div>
      <div class="two-col">
        <div class="field"><label>Inicio</label><input type="date" id="fStart"></div>
        <div class="field"><label>Término</label><input type="date" id="fEnd"></div>
      </div>
      <div class="field">
        <label>Estado</label>
        <select id="fStatus">
          <option value="programada">Programada</option>
          <option value="confirmada">Confirmada</option>
          <option value="realizada">Realizada</option>
          <option value="reprogramada">Reprogramada</option>
        </select>
      </div>
      <div class="field">
        <label>Notas</label>
        <textarea id="fNotes" placeholder="Comité evaluador, observaciones, compromisos…"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="deleteBtn" style="display:none;">Eliminar</button>
        <div style="display:flex; gap:10px; margin-left:auto;">
          <button class="btn-secondary" id="cancelBtn">Cancelar</button>
          <button class="btn-primary" id="saveBtn">Guardar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: nuevo programa -->
<div class="overlay" id="overlayProgram">
  <div class="modal">
    <div class="modal-head">
      <h2>Nuevo programa</h2>
      <button class="modal-close" id="closeProgramModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Facultad</label>
        <input type="text" id="pFaculty" list="facultyList" placeholder="Ej. Ciencias Sociales">
        <datalist id="facultyList"></datalist>
      </div>
      <div class="field">
        <label>Nombre del programa</label>
        <input type="text" id="pName" placeholder="Ej. Magíster en...">
      </div>
      <div class="modal-footer">
        <div style="display:flex; gap:10px; margin-left:auto;">
          <button class="btn-secondary" id="cancelProgramBtn">Cancelar</button>
          <button class="btn-primary" id="saveProgramBtn">Agregar</button>
        </div>
      </div>
    </div>
  </div>
</div>

async function loadData(){
  const footNote = document.getElementById("footNote");
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      state.programs = parsed.programs || [];
      state.visits = parsed.visits || [];
      footNote.textContent = "Datos guardados para tu usuario. Solo tú los ves.";
    } else {
      seedData();
      await saveData();
      footNote.textContent = "Datos cargados desde Calendario_Calidad_Magister.xlsx. Se guardan automáticamente al editar.";
    }
  } catch(err){
    seedData();
    footNote.textContent = "Datos del archivo original (modo temporal — no se pudo acceder al almacenamiento).";
  }
  fitToData();
  render();
}

async function saveData(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({programs:state.programs, visits:state.visits}), false);
  } catch(err){ console.error("No se pudo guardar:", err); }
}

function facultyList(){
  return [...new Set(state.programs.map(p=>p.faculty))].sort((a,b)=>a.localeCompare(b));
}
function facultyColor(faculty){
  const idx = facultyList().indexOf(faculty);
  return FACULTY_COLORS[idx % FACULTY_COLORS.length];
}

/* ---------- window / date math ---------- */
function windowMonths(){
  const arr = [];
  for(let i=0;i<state.numMonths;i++){
    const m0 = (state.windowStart.month0 + i) % 12;
    const y = state.windowStart.year + Math.floor((state.windowStart.month0 + i) / 12);
    arr.push({year:y, month0:m0, label: MONTHS[m0] + " " + String(y).slice(2)});
  }
  return arr;
}
function windowBounds(){
  const wm = windowMonths();
  const start = new Date(wm[0].year, wm[0].month0, 1);
  const last = wm[wm.length-1];
  const end = new Date(last.year, last.month0+1, 1);
  return {start, end};
}
function pctOf(dateStr){
  const {start,end} = windowBounds();
  const total = end - start;
  const d = new Date(dateStr+"T00:00:00");
  const pct = ((d - start) / total) * 100;
  return Math.max(0, Math.min(100, pct));
}
function shiftWindow(delta){
  let m0 = state.windowStart.month0 + delta;
  let y = state.windowStart.year;
  while(m0 < 0){ m0 += 12; y -= 1; }
  while(m0 > 11){ m0 -= 12; y += 1; }
  state.windowStart = { year:y, month0:m0 };
}
function fitToData(){
  if(state.visits.length === 0) return;
  let minD = null, maxD = null;
  state.visits.forEach(v=>{
    const s = new Date(v.start+"T00:00:00");
    const e = new Date(v.end+"T00:00:00");
    if(!minD || s < minD) minD = s;
    if(!maxD || e > maxD) maxD = e;
  });
  state.windowStart = { year: minD.getFullYear(), month0: minD.getMonth() };
  const span = (maxD.getFullYear()-minD.getFullYear())*12 + (maxD.getMonth()-minD.getMonth()) + 1;
  state.numMonths = Math.max(1, Math.min(12, span));
}

/* ---------- rendering ---------- */
function renderToolbar(){
  const facSel = document.getElementById("facultyFilter");
  const current = state.facultyFilter;
  facSel.innerHTML = `<option value="all">Todas las facultades</option>` +
    facultyList().map(f=>`<option value="${f}">${f}</option>`).join("");
  facSel.value = current;

  document.getElementById("rangeLabel").textContent =
    windowMonths()[0].label + " – " + windowMonths()[windowMonths().length-1].label;
}

function renderMonthsHead(){
  const el = document.getElementById("monthsHead");
  const wm = windowMonths();
  el.style.gridTemplateColumns = `repeat(${wm.length}, 1fr)`;
  el.innerHTML = wm.map(m=>`<div class="month-cell">${m.label}</div>`).join("");
}

function matchesFilter(program){
  if(state.facultyFilter !== "all" && program.faculty !== state.facultyFilter) return false;
  if(state.search && !program.name.toLowerCase().includes(state.search.toLowerCase())) return false;
  return true;
}

function renderBoard(){
  const side = document.getElementById("sideList");
  const chart = document.getElementById("chartBody");
  side.innerHTML = "";
  chart.innerHTML = "";

  const wm = windowMonths();
  const gridCols = `repeat(${wm.length}, 1fr)`;

  const sorted = [...state.programs].sort((a,b)=>{
    if(a.faculty !== b.faculty) return a.faculty.localeCompare(b.faculty);
    return a.name.localeCompare(b.name);
  });

  let lastFaculty = null;
  let shown = 0;
  let scheduledCount = 0, pendingCount = 0;

  sorted.forEach(program=>{
    if(!matchesFilter(program)) return;
    shown++;
    if(program.faculty !== lastFaculty){
      lastFaculty = program.faculty;
      const gh = document.createElement("div");
      gh.className = "group-header";
      gh.textContent = program.faculty;
      side.appendChild(gh);
      const ghs = document.createElement("div");
      ghs.className = "group-header-spacer";
      chart.appendChild(ghs);
    }

    const color = facultyColor(program.faculty);
    const row = document.createElement("div");
    row.className = "program-row" + (program.pending ? " pending-row" : "");
    row.innerHTML = `<span class="dot" style="background:${color}"></span>
      <div><div class="program-name">${program.name}</div>${program.pending ? `<div class="program-tag">${program.pendingNote || "Pendiente"}</div>` : ""}</div>`;
    side.appendChild(row);

    const track = document.createElement("div");
    track.className = "track-row" + (program.pending ? " pending-row" : "");

    const gridLines = document.createElement("div");
    gridLines.className = "grid-lines";
    gridLines.style.gridTemplateColumns = gridCols;
    for(let i=0;i<wm.length;i++) gridLines.appendChild(document.createElement("div"));
    track.appendChild(gridLines);

    const now = new Date();
    const {start:winStart, end:winEnd} = windowBounds();
    if(now >= winStart && now < winEnd){
      const pct = pctOf(now.toISOString().slice(0,10));
      const line = document.createElement("div");
      line.className = "today-line";
      line.style.left = pct + "%";
      const tag = document.createElement("div");
      tag.className = "today-tag";
      tag.textContent = "Hoy";
      tag.style.left = pct + "%";
      track.appendChild(line);
      track.appendChild(tag);
    }

    const visits = state.visits.filter(v => v.programId === program.id);
    if(visits.length === 0 && program.pending){
      pendingCount++;
    } else {
      visits.forEach(v=>{
        scheduledCount++;
        const startPct = pctOf(v.start);
        const endDateExclusive = new Date(v.end+"T00:00:00");
        endDateExclusive.setDate(endDateExclusive.getDate()+1);
        const endPct = pctOf(endDateExclusive.toISOString().slice(0,10));
        const widthPct = Math.max(endPct - startPct, 1.5);
        const bar = document.createElement("div");
        bar.className = `bar ${v.status}`;
        bar.style.left = startPct + "%";
        bar.style.width = widthPct + "%";
        bar.title = `${v.type} · ${v.start} → ${v.end}`;
        bar.onclick = ()=> openModal(v);
        track.appendChild(bar);
      });
    }

    chart.appendChild(track);
  });

  if(shown === 0){
    side.innerHTML = `<div style="padding:24px 16px; font-size:13px; color:var(--ink-soft);">Sin resultados para este filtro.</div>`;
  }

  document.getElementById("summaryLine").innerHTML =
    `<span><b>${state.programs.filter(p=>!p.pending).length}</b> programas con visita agendada</span>` +
    `<span><b>${state.programs.filter(p=>p.pending).length}</b> pendientes por definir</span>` +
    `<span><b>${facultyList().length}</b> facultades</span>`;
}

function render(){
  renderToolbar();
  renderMonthsHead();
  renderBoard();
}

/* ---------- modal: visita ---------- */
const overlay = document.getElementById("overlay");
const fProgram = document.getElementById("fProgram");

function populateProgramSelect(){
  const sorted = [...state.programs].sort((a,b)=> a.faculty.localeCompare(b.faculty) || a.name.localeCompare(b.name));
  fProgram.innerHTML = sorted.map(p=>`<option value="${p.id}">${p.faculty} — ${p.name}</option>`).join("");
}

function openModal(visit, presetProgramId){
  populateProgramSelect();
  document.getElementById("deleteBtn").style.display = visit ? "inline-block" : "none";
  document.getElementById("modalTitle").textContent = visit ? "Editar visita" : "Nueva visita";
  editingId = visit ? visit.id : null;
  document.getElementById("fProgram").value = visit ? visit.programId : (presetProgramId || state.programs[0]?.id);
  document.getElementById("fType").value = visit ? visit.type : "Visita Mecanismo de Calidad";
  const defYear = state.windowStart.year, defMonth = String(state.windowStart.month0+1).padStart(2,"0");
  document.getElementById("fStart").value = visit ? visit.start : `${defYear}-${defMonth}-01`;
  document.getElementById("fEnd").value = visit ? visit.end : `${defYear}-${defMonth}-28`;
  document.getElementById("fStatus").value = visit ? visit.status : "programada";
  document.getElementById("fNotes").value = visit ? (visit.notes || "") : "";
  overlay.classList.add("open");
}
function closeModal(){ overlay.classList.remove("open"); editingId = null; }

document.getElementById("openModalBtn").onclick = ()=> openModal(null);
document.getElementById("closeModalBtn").onclick = closeModal;
document.getElementById("cancelBtn").onclick = closeModal;
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });

document.getElementById("saveBtn").onclick = async ()=>{
  const start = document.getElementById("fStart").value;
  const end = document.getElementById("fEnd").value;
  if(!start || !end || end < start){
    alert("Revisa las fechas: el término debe ser igual o posterior al inicio.");
    return;
  }
  const data = {
    programId: document.getElementById("fProgram").value,
    type: document.getElementById("fType").value,
    start, end,
    status: document.getElementById("fStatus").value,
    notes: document.getElementById("fNotes").value
  };
  if(editingId){
    const idx = state.visits.findIndex(v=>v.id===editingId);
    state.visits[idx] = {...state.visits[idx], ...data};
  } else {
    state.visits.push({ id:crypto.randomUUID(), ...data });
  }
  await saveData();
  closeModal();
  render();
};

document.getElementById("deleteBtn").onclick = async ()=>{
  if(!editingId) return;
  state.visits = state.visits.filter(v=>v.id !== editingId);
  await saveData();
  closeModal();
  render();
};

/* ---------- modal: nuevo programa ---------- */
const overlayProgram = document.getElementById("overlayProgram");
document.getElementById("addProgramBtn").onclick = ()=>{
  document.getElementById("facultyList").innerHTML = facultyList().map(f=>`<option value="${f}">`).join("");
  document.getElementById("pFaculty").value = "";
  document.getElementById("pName").value = "";
  overlayProgram.classList.add("open");
};
document.getElementById("closeProgramModalBtn").onclick = ()=> overlayProgram.classList.remove("open");
document.getElementById("cancelProgramBtn").onclick = ()=> overlayProgram.classList.remove("open");
overlayProgram.addEventListener("click", (e)=>{ if(e.target === overlayProgram) overlayProgram.classList.remove("open"); });

document.getElementById("saveProgramBtn").onclick = async ()=>{
  const faculty = document.getElementById("pFaculty").value.trim();
  const name = document.getElementById("pName").value.trim();
  if(!faculty || !name){ alert("Completa facultad y nombre del programa."); return; }
  state.programs.push({ id: crypto.randomUUID(), name, faculty, pending:true, pendingNote:"Sin visita agendada" });
  await saveData();
  overlayProgram.classList.remove("open");
  render();
};

/* ---------- toolbar events ---------- */
document.getElementById("facultyFilter").onchange = (e)=>{ state.facultyFilter = e.target.value; render(); };
document.getElementById("searchInput").oninput = (e)=>{ state.search = e.target.value; render(); };
document.getElementById("prevBtn").onclick = ()=>{ shiftWindow(-1); render(); };
document.getElementById("nextBtn").onclick = ()=>{ shiftWindow(1); render(); };
document.getElementById("fitBtn").onclick = ()=>{ fitToData(); render(); };

loadData();
</script>
